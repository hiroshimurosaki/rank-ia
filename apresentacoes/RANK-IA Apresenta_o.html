document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

06bf0d\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n/* latin-ext */\n@font-face {\n  font-family: 'Sora';\n  font-style: normal;\n  font-weight: 800;\n  font-display: swap;\n  src: url(\"fa0ea94a-054a-46cd-bc4f-feebc0b307b5\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Sora';\n  font-style: normal;\n  font-weight: 800;\n  font-display: swap;\n  src: url(\"42043c2a-73b9-4410-9d02-61f64e06bf0d\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n<\u002Fstyle>\n<script src=\"2a4e18dc-a1f9-457c-97fc-d2b9665ae280\"><\u002Fscript>\n\n<style>\n:root {\n  --bg: #070c1a;\n  --surface: #0f1829;\n  --surface2: #162035;\n  --border: #1e2d47;\n  --cyan: #38bdf8;\n  --purple: #a78bfa;\n  --green: #34d399;\n  --yellow: #fbbf24;\n  --text: #e2e8f0;\n  --muted: #64748b;\n  --muted2: #94a3b8;\n}\n* { box-sizing: border-box; margin: 0; padding: 0; }\nbody { background: #000; font-family: 'Sora', sans-serif; }\n\n/* ── Slide base ── */\nsection {\n  width: 1920px; height: 1080px;\n  background: var(--bg);\n  color: var(--text);\n  display: flex; flex-direction: column;\n  position: relative; overflow: hidden;\n}\n\n/* noise texture overlay removed for export compatibility */\nsection::before { display: none; }\n\n/* grid lines */\nsection::after {\n  content: '';\n  position: absolute; inset: 0;\n  background-image:\n    linear-gradient(rgba(56,189,248,0.03) 1px, transparent 1px),\n    linear-gradient(90deg, rgba(56,189,248,0.03) 1px, transparent 1px);\n  background-size: 80px 80px;\n  pointer-events: none; z-index: 0;\n}\n\n.slide-inner {\n  position: relative; z-index: 1;\n  width: 100%; height: 100%;\n  display: flex; flex-direction: column;\n}\n\n/* ── Slide label ── */\n.slide-tag {\n  position: absolute; top: 48px; right: 64px;\n  font-size: 13px; letter-spacing: 0.15em; text-transform: uppercase;\n  color: var(--muted); font-weight: 500;\n}\n\n/* ── Glow accents ── */\n.glow-cyan {\n  position: absolute;\n  border-radius: 50%; filter: blur(120px); pointer-events: none;\n  background: rgba(56,189,248,0.12);\n}\n.glow-purple {\n  position: absolute;\n  border-radius: 50%; filter: blur(140px); pointer-events: none;\n  background: rgba(167,139,250,0.10);\n}\n\n/* ── Typography ── */\n.eyebrow {\n  font-size: 24px; letter-spacing: 0.12em; text-transform: uppercase;\n  color: var(--cyan); font-weight: 600; margin-bottom: 20px;\n}\nh1 { font-size: 96px; font-weight: 800; line-height: 1.0; }\nh2 { font-size: 60px; font-weight: 700; line-height: 1.1; }\nh3 { font-size: 36px; font-weight: 600; }\n.lead { font-size: 28px; color: var(--muted2); font-weight: 300; line-height: 1.6; }\n.caption { font-size: 18px; color: var(--muted); }\n\n/* ── Layout helpers ── */\n.pad { padding: 80px 120px; }\n.pad-sm { padding: 60px 120px; }\n.row { display: flex; gap: 40px; }\n.col { display: flex; flex-direction: column; gap: 24px; }\n.spacer { flex: 1; }\n\n/* ── Cards ── */\n.card {\n  background: var(--surface); border: 1px solid var(--border);\n  border-radius: 16px; padding: 32px;\n}\n.card-accent-cyan { border-top: 3px solid var(--cyan); }\n.card-accent-purple { border-top: 3px solid var(--purple); }\n.card-accent-green { border-top: 3px solid var(--green); }\n\n/* ── Code blocks ── */\npre {\n  background: #060b14; border: 1px solid var(--border);\n  border-radius: 12px; padding: 32px 36px;\n  font-family: 'JetBrains Mono', monospace;\n  font-size: 18px; line-height: 1.75;\n  overflow: hidden;\n}\n.kw { color: #7dd3fc; }     /* keywords */\n.cls { color: #a78bfa; }    /* class names */\n.fn { color: #34d399; }     /* functions */\n.st { color: #fbbf24; }     /* strings */\n.cm { color: #475569; font-style: italic; }  /* comments */\n.dt { color: #fb923c; }     /* decorators/types */\n.pn { color: #e2e8f0; }     /* punctuation */\n\n/* ── Divider ── */\n.divider {\n  width: 64px; height: 3px;\n  background: linear-gradient(90deg, var(--cyan), var(--purple));\n  border-radius: 2px; margin: 24px 0;\n}\n\n/* ── Pill badge ── */\n.badge {\n  display: inline-block; padding: 6px 18px;\n  border-radius: 999px; font-size: 14px; font-weight: 600;\n  letter-spacing: 0.05em;\n}\n.badge-cyan { background: rgba(56,189,248,0.12); color: var(--cyan); border: 1px solid rgba(56,189,248,0.3); }\n.badge-purple { background: rgba(167,139,250,0.12); color: var(--purple); border: 1px solid rgba(167,139,250,0.3); }\n.badge-green { background: rgba(52,211,153,0.12); color: var(--green); border: 1px solid rgba(52,211,153,0.3); }\n\n/* ── Bottom bar ── */\n.bottom-bar {\n  position: absolute; bottom: 0; left: 0; right: 0;\n  height: 4px;\n  background: linear-gradient(90deg, var(--cyan), var(--purple), var(--cyan));\n}\n\n/* ── UML Class diagram helpers ── */\n.uml-box {\n  background: var(--surface2); border: 1.5px solid var(--border);\n  border-radius: 10px; font-family: 'JetBrains Mono', monospace;\n  font-size: 15px; min-width: 260px; overflow: hidden;\n}\n.uml-header {\n  background: var(--surface); padding: 12px 20px;\n  border-bottom: 1px solid var(--border);\n  font-weight: 600; color: var(--cyan); font-size: 16px;\n  text-align: center;\n}\n.uml-section { padding: 12px 20px; border-bottom: 1px solid var(--border); }\n.uml-section:last-child { border-bottom: none; }\n.uml-attr { color: var(--muted2); margin-bottom: 4px; }\n.uml-method { color: var(--green); margin-bottom: 4px; }\n.uml-label { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.1em; margin-bottom: 8px; }\n\n/* SOLID cards */\n.solid-card {\n  flex: 1; background: var(--surface); border: 1px solid var(--border);\n  border-radius: 14px; padding: 28px 24px;\n  display: flex; flex-direction: column; gap: 10px;\n  overflow: hidden;\n}\n.solid-letter {\n  font-size: 52px; font-weight: 800; line-height: 1;\n  background: linear-gradient(135deg, var(--cyan), var(--purple));\n  -webkit-background-clip: text; -webkit-text-fill-color: transparent;\n}\n.solid-name { font-size: 17px; font-weight: 600; color: var(--text); }\n.solid-desc { font-size: 15px; color: var(--muted2); line-height: 1.45; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; }\n\n/* arch boxes */\n.arch-layer {\n  border-radius: 12px; padding: 22px 32px;\n  display: flex; align-items: center; gap: 24px;\n  border: 1px solid var(--border);\n}\n<\u002Fstyle>\n<\u002Fhead>\n<body>\n<deck-stage>\n\n<!-- ═══════════════════════════════════════════════════\n     SLIDE 01 — TITLE\n════════════════════════════════════════════════════ -->\n<section data-screen-label=\"01 Title\">\n  <div class=\"glow-cyan\" style=\"width:700px;height:700px;top:-200px;right:-100px;\"><\u002Fdiv>\n  <div class=\"glow-purple\" style=\"width:600px;height:600px;bottom:-200px;left:-100px;\"><\u002Fdiv>\n  <div class=\"slide-inner pad\" style=\"justify-content:center;\">\n    <div style=\"font-size:24px;letter-spacing:0.12em;text-transform:uppercase;color:var(--cyan);font-weight:600;margin-bottom:20px;\">Engenharia de Software II · 2025<\u002Fdiv>\n    <h1 style=\"background:linear-gradient(135deg,#f1f5f9 30%,#38bdf8 70%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:8px;\">RANK-IA<\u002Fh1>\n    <div style=\"font-size:34px;color:var(--muted2);font-weight:300;margin-bottom:56px;\">\n      Sua organização de maneira <span style=\"color:var(--cyan);font-weight:500;\">eficiente<\u002Fspan>\n    <\u002Fdiv>\n    <div class=\"divider\"><\u002Fdiv>\n    <div style=\"margin-top:40px;display:flex;gap:48px;align-items:center;\">\n      <div>\n        <div style=\"font-size:24px;font-weight:500;color:var(--muted2);margin-bottom:10px;\">Integrantes<\u002Fdiv>\n        <div style=\"font-size:24px;line-height:1.9;color:var(--muted2);\">\n          Fernando Hiroshi Murusaki &nbsp;·&nbsp; RA 241025851<br>\n          Igor dos Reis Gomes &nbsp;·&nbsp; RA 241025265<br>\n          Matheus Santos Magro &nbsp;·&nbsp; RA 231025335<br>\n          Murilo Tomaz Gonzaga &nbsp;·&nbsp; RA 241024684\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"width:1px;height:120px;background:var(--border);\"><\u002Fdiv>\n      <div>\n        <div style=\"font-size:24px;font-weight:500;color:var(--muted2);margin-bottom:10px;\">Grupo<\u002Fdiv>\n        <div style=\"font-size:36px;font-weight:700;color:var(--cyan);\">Grupo 8<\u002Fdiv>\n        <div style=\"font-size:24px;color:var(--muted);\">UNESP Bauru · BCC<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <div class=\"bottom-bar\"><\u002Fdiv>\n<\u002Fsection>\n\n<!-- ═══════════════════════════════════════════════════\n     SLIDE 02 — INTRODUÇÃO\n════════════════════════════════════════════════════ -->\n<section data-screen-label=\"02 Introdução\">\n  <div class=\"glow-cyan\" style=\"width:500px;height:500px;top:-100px;left:400px;\"><\u002Fdiv>\n  <div class=\"slide-inner pad-sm\">\n    <div class=\"eyebrow\">O que é o RANK-IA?<\u002Fdiv>\n    <h2 style=\"max-width:900px;margin-bottom:16px;\">Formação inteligente de <span style=\"color:var(--cyan);\">equipes corporativas<\u002Fspan><\u002Fh2>\n    <div class=\"divider\"><\u002Fdiv>\n    <div style=\"margin-top:40px;display:flex;gap:40px;\">\n      <div style=\"flex:1.2;\">\n        <p class=\"lead\" style=\"font-size:26px;margin-bottom:32px;\">\n          Aplicação web corporativa que utiliza <strong style=\"color:var(--cyan);\">Reinforcement Learning<\u002Fstrong> para montar equipes otimizadas com base em habilidades, competências e gaps dos colaboradores.\n        <\u002Fp>\n        <div style=\"display:flex;flex-direction:column;gap:16px;\">\n          <div style=\"display:flex;align-items:center;gap:16px;\">\n            <div style=\"width:8px;height:8px;border-radius:50%;background:var(--cyan);flex-shrink:0;\"><\u002Fdiv>\n            <span style=\"font-size:24px;color:var(--muted2);\">Geração automática de equipes com <strong style=\"color:var(--text);\">Coeficiente de Aproveitamento<\u002Fstrong><\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"display:flex;align-items:center;gap:16px;\">\n            <div style=\"width:8px;height:8px;border-radius:50%;background:var(--purple);flex-shrink:0;\"><\u002Fdiv>\n            <span style=\"font-size:24px;color:var(--muted2);\">Ajustes manuais que retroalimentam o modelo de IA<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"display:flex;align-items:center;gap:16px;\">\n            <div style=\"width:8px;height:8px;border-radius:50%;background:var(--green);flex-shrink:0;\"><\u002Fdiv>\n            <span style=\"font-size:24px;color:var(--muted2);\">Sugestão de treinamentos baseados em gaps identificados<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"display:flex;align-items:center;gap:16px;\">\n            <div style=\"width:8px;height:8px;border-radius:50%;background:var(--yellow);flex-shrink:0;\"><\u002Fdiv>\n            <span style=\"font-size:24px;color:var(--muted2);\">Relatórios de desempenho individual e coletivo<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"flex:1;display:flex;flex-direction:column;gap:24px;\">\n        <div class=\"card card-accent-cyan\">\n          <div style=\"font-size:24px;color:var(--muted);margin-bottom:8px;text-transform:uppercase;letter-spacing:.1em;\">Perfil<\u002Fdiv>\n          <div style=\"font-size:26px;font-weight:600;color:var(--cyan);\">Gestor / RH<\u002Fdiv>\n          <div style=\"font-size:24px;color:var(--mu (#ia)\"><\u002Fline>\n        <text x=\"672\" y=\"420\" font-family=\"Sora\" font-size=\"11\" fill=\"#fb923c\">gera<\u002Ftext>\n      <\u002Fsvg>\n      <div style=\"flex:1;display:flex;flex-direction:column;gap:20px;padding-top:32px;\">\n        <div class=\"card card-accent-green\">\n          <div style=\"font-size:14px;color:var(--green);font-weight:600;margin-bottom:8px;\">Por que detalhar GeradorEquipes?<\u002Fdiv>\n          <p style=\"font-size:15px;color:var(--muted2);line-height:1.6;\">É o coração do sistema: responsável por receber os colaboradores, aplicar o modelo de RL, gerar equipes e calcular o Coeficiente de Aproveitamento.<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:12px;\">\n          <div style=\"padding:14px 18px;background:rgba(56,189,248,0.06);border:1px solid rgba(56,189,248,0.2);border-radius:10px;\">\n            <div style=\"font-size:14px;font-weight:600;color:var(--cyan);\">ModeloRL<\u002Fdiv>\n            <div style=\"font-size:13px;color:var(--muted2);margin-top:4px;\">Encapsula os pesos e hiperparâmetros do algoritmo de RL<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"padding:14px 18px;background:rgba(167,139,250,0.06);border:1px solid rgba(167,139,250,0.2);border-radius:10px;\">\n            <div style=\"font-size:14px;font-weight:600;color:var(--purple);\">CriterioFormacao<\u002Fdiv>\n            <div style=\"font-size:13px;color:var(--muted2);margin-top:4px;\">Define os parâmetros e requisitos para formação da equipe<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"padding:14px 18px;background:rgba(251,191,36,0.06);border:1px solid rgba(251,191,36,0.2);border-radius:10px;\">\n            <div style=\"font-size:14px;font-weight:600;color:var(--yellow);\">HistoricoAjustes<\u002Fdiv>\n            <div style=\"font-size:13px;color:var(--muted2);margin-top:4px;\">Registra mudanças manuais para retroalimentar o modelo<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"padding:14px 18px;background:rgba(251,146,60,0.06);border:1px solid rgba(251,146,60,0.2);border-radius:10px;\">\n            <div style=\"font-size:14px;font-weight:600;color:#fb923c;\">CoeficienteAproveitamento<\u002Fdiv>\n            <div style=\"font-size:13px;color:var(--muted2);margin-top:4px;\">Calcula e expõe a métrica de qualidade da equipe gerada<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <div class=\"bottom-bar\"><\u002Fdiv>\n<\u002Fsection>\n\n<!-- ═══════════════════════════════════════════════════\n     SLIDE 08 — CÓDIGO DO GERADOR\n════════════════════════════════════════════════════ -->\n<section data-screen-label=\"08 Código GeradorEquipes\">\n  <div class=\"glow-cyan\" style=\"width:400px;height:400px;top:-50px;right:300px;\"><\u002Fdiv>\n  <div class=\"slide-inner pad-sm\">\n    <div class=\"eyebrow\">Implementação Python<\u002Fdiv>\n    <h2 style=\"margin-bottom:8px;\">Código: <span style=\"color:var(--cyan);\">GeradorEquipes<\u002Fspan><\u002Fh2>\n    <div class=\"divider\" style=\"margin-bottom:24px;\"><\u002Fdiv>\n    <div style=\"display:flex;gap:32px;flex:1;min-height:0;\">\n      <pre style=\"flex:1;font-size:14px;line-height:1.6;overflow:hidden;\"><span class=\"kw\">from<\u002Fspan> dataclasses <span class=\"kw\">import<\u002Fspan> dataclass\n<span class=\"kw\">from<\u002Fspan> typing <span class=\"kw\">import<\u002Fspan> List\n<span class=\"kw\">from<\u002Fspan> uuid <span class=\"kw\">import<\u002Fspan> uuid4\n<span class=\"kw\">import<\u002Fspan> numpy <span class=\"kw\">as<\u002Fspan> np\n\n<span class=\"dt\">@dataclass<\u002Fspan>\n<span class=\"kw\">class<\u002Fspan> <span class=\"cls\">CriterioFormacao<\u002Fspan>:\n    tamanho_equipe: <span class=\"kw\">int<\u002Fspan>\n    habilidades_req: List[<span class=\"kw\">str<\u002Fspan>]\n    peso_experiencia: <span class=\"kw\">float<\u002Fspan> = <span class=\"st\">0.5<\u002Fspan>\n\n    <span class=\"kw\">def<\u002Fspan> <span class=\"fn\">validar<\u002Fspan>(<span class=\"kw\">self<\u002Fspan>) -&gt; <span class=\"kw\">bool<\u002Fspan>:\n        <span class=\"kw\">return<\u002Fspan> <span class=\"kw\">self<\u002Fspan>.tamanho_equipe &gt; <span class=\"st\">0<\u002Fspan>\n\n<span class=\"dt\">@dataclass<\u002Fspan>\n<span class=\"kw\">class<\u002Fspan> <span class=\"cls\">CoeficienteAproveitamento<\u002Fspan>:\n    valor: <span class=\"kw\">float<\u002Fspan> = <span class=\"st\">0.0<\u002Fspan>\n\n    <span class=\"kw\">def<\u002Fspan> <span class=\"fn\">calcular<\u002Fspan>(<span class=\"kw\">self<\u002Fspan>, membros: List) -&gt; <span class=\"kw\">float<\u002Fspan>:\n        <span class=\"cm\"># Média ponderada: habilidades vs gaps<\u002Fspan>\n        scores = [\n            <span class=\"kw\">len<\u002Fspan>(m.habilidades) / (<span class=\"kw\">len<\u002Fspan>(m.gaps) + <span class=\"st\">1<\u002Fspan>)\n            <span class=\"kw\">for<\u002Fspan> m <span class=\"kw\">in<\u002Fspan> membros\n        ]\n        <span class=\"kw\">self<\u002Fspan>.valor = <span class=\"kw\">round<\u002Fspan>(<span class=\"kw\">float<\u002Fspan>(np.mean(scores)), <span class=\"st\">3<\u002Fspan>)\n        <span class=\"kw\">return<\u002Fspan> <span class=\"kw\">self<\u002Fspan>.valor<\u002Fpre>\n      <pre style=\"flex:1;font-size:14px;line-height:1.6;overflow:hidden;\"><span class=\"kw\">class<\u002Fspan> <span class=\"cls\">ModeloRL<\u002Fspan>:\n    <span class=\"kw\">def<\u002Fspan> <span class=\"fn\">__init__<\u002Fspan>(<span class=\"kw\">self<\u002Fspan>):\n        <span class=\"kw\">self<\u002Fspan>.pesos = np.random.rand(<span class=\"st\">10<\u002Fspan>)\n        <span class=\"kw\">self<\u002Fspan>.epsilon = <span class=\"st\">0.1<\u002Fspan>\n        <span class=\"kw\">self<\u002Fspan>.versao = <span class=\"st\">1<\u002Fspan>\n\n    <span class=\"kw\">def<\u002Fspan> <span class=\"fn\">predizer<\u002Fspan>(<span class=\"kw\">self<\u002Fspan>, colaboradores, criterio):\n        <span class=\"cm\"># Seleciona os n melhores colaboradores<\u002Fspan>\n        pontuados = <span class=\"kw\">sorted<\u002Fspan>(\n            colaboradores,\n            key=<span class=\"kw\">lambda<\u002Fspan> c: <span class=\"kw\">len<\u002Fspan>(c.habilidades),\n            reverse=<span class=\"kw\">True<\u002Fspan>\n        )\n        <span class=\"kw\">return<\u002Fspan> pontuados[:criterio.tamanho_equipe]\n\n    <span class=\"kw\">def<\u002Fspan> <span class=\"fn\">treinar<\u002Fspan>(<span class=\"kw\">self<\u002Fspan>, feedback: <span class=\"kw\">dict<\u002Fspan>):\n        vals = np.array(<span class=\"kw\">list<\u002Fspan>(feedback.values())[:10])\n        <span class=\"kw\">self<\u002Fspan>.pesos += <span class=\"st\">0.01<\u002Fspan> * vals\n        <span class=\"kw\">self<\u002Fspan>.versao += <span class=\"st\">1<\u002Fspan>\n\n<span class=\"kw\">class<\u002Fspan> <span class=\"cls\">GeradorEquipes<\u002Fspan>:\n    <span class=\"kw\">def<\u002Fspan> <span class=\"fn\">__init__<\u002Fspan>(<span class=\"kw\">self<\u002Fspan>, criterio: <span class=\"cls\">CriterioFormacao<\u002Fspan>):\n        <span class=\"kw\">self<\u002Fspan>.modelo = <span class=\"cls\">ModeloRL<\u002Fspan>()\n        <span class=\"kw\">self<\u002Fspan>.criterio = criterio\n        <span class=\"kw\">self<\u002Fspan>.historico = []\n\n    <span class=\"kw\">def<\u002Fspan> <span class=\"fn\">gerar<\u002Fspan>(<span class=\"kw\">self<\u002Fspan>, colaboradores) -&gt; <span class=\"cls\">Equipe<\u002Fspan>:\n        membros = <span class=\"kw\">self<\u002Fspan>.modelo.predizer(\n            colaboradores, <span class=\"kw\">self<\u002Fspan>.criterio)\n        ca = <span class=\"cls\">CoeficienteAproveitamento<\u002Fspan>()\n        ca.calcular(membros)\n        <span class=\"kw\">return<\u002Fspan> <span class=\"cls\">Equipe<\u002Fspan>(uuid4(), membros, ca)\n\n    <span class=\"kw\">def<\u002Fspan> <span class=\"fn\">aplicar_feedback<\u002Fspan>(<span class=\"kw\">self<\u002Fspan>, fb: <span class=\"kw\">dict<\u002Fspan>):\n        <span class=\"kw\">self<\u002Fspan>.historico.append(fb)\n        <span class=\"kw\">self<\u002Fspan>.modelo.treinar(fb)<\u002Fpre>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <div class=\"bottom-bar\"><\u002Fdiv>\n<\u002Fsection>\n\n<!-- ═══════════════════════════════════════════════════\n     SLIDE 09 — DIAGRAMA DO CÓDIGO\n════════════════════════════════════════════════════ -->\n<section data-screen-label=\"09 Diagrama do Código\">\n  <div class=\"glow-purple\" style=\"width:400px;height:400px;bottom:0;right:200px;\"><\u002Fdiv>\n  <div class=\"slide-inner pad-sm\">\n    <div class=\"eyebrow\">UML gerado a partir do código<\u002Fdiv>\n    <h2 style=\"margin-bottom:8px;\">Diagrama de Classes <span style=\"color:var(--purple);\">do Código<\u002Fspan><\u002Fh2>\n    <div class=\"divider\" style=\"margin-bottom:24px;\"><\u002Fdiv>\n    <div style=\"display:flex;gap:40px;align-items:flex-start;\">\n      <svg width=\"1100\" height=\"680\" viewBox=\"0 0 1100 680\">\n        <defs>\n          <marker id=\"cd\" markerWidth=\"8\" markerHeight=\"8\" refX=\"6\" refY=\"3\" orient=\"auto\"><path d=\"M0,0 L0,6 L8,3 z\" fill=\"#64748b\"><\u002Fpath><\u002Fmarker>\n          <marker id=\"cdc\" markerWidth=\"10\" markerHeight=\"10\" refX=\"2\" refY=\"5\" orient=\"auto\"><polygon points=\"2,5 6,1 10,5 6,9\" fill=\"#34d399\" stroke=\"#34d399\"><\u002Fpolygon><\u002Fmarker>\n        <\u002Fdefs>\n\n        <!-- CriterioFormacao -->\n        <rect x=\"0\" y=\"80\" width=\"300\" height=\"160\" rx=\"9\" fill=\"#0f1829\" stroke=\"#a78bfa\" stroke-width=\"2\"><\u002Frect>\n        <rect x=\"0\" y=\"80\" width=\"300\" height=\"38\" rx=\"9\" fill=\"rgba(167,139,250,0.13)\"><\u002Frect>\n        <rect x=\"0\" y=\"106\" width=\"300\" height=\"12\" fill=\"#0f1829\"><\u002Frect>\n        <text x=\"150\" y=\"106\" text-anchor=\"middle\" font-family=\"Sora\" font-size=\"15\" font-weight=\"700\" fill=\"#a78bfa\">CriterioFormacao<\u002Ftext>\n        <text x=\"150\" y=\"120\" text-anchor=\"middle\" font-family=\"Sora\" font-size=\"10\" fill=\"#64748b\">«dataclass»<\u002Ftext>\n        <line x1=\"0\" y1=\"128\" x2=\"300\" y2=\"128\" stroke=\"#1e2d47\"><\u002Fline>\n        <text x=\"12\" y=\"148\" font-family=\"JetBrains Mono\" font-size=\"13\" fill=\"#94a3b8\">+ tamanho_equipe: int<\u002Ftext>\n        <text x=\"12\" y=\"166\" font-family=\"JetBrains Mono\" font-size=\"13\" fill=\"#94a3b8\">+ habilidades_req: List[str]<\u002Ftext>\n        <text x=\"12\" y=\"184\" font-family=\"JetBrains Mono\" font-size=\"13\" fill=\"#94a3b8\">+ peso_experiencia: float<\u002Ftext>\n        <line x1=\"0\" y1=\"194\" x2=\"300\" y2=\"194\" stroke=\"#1e2d47\"><\u002Fline>\n        <text x=\"12\" y=\"218\" font-family=\"JetBrains Mono\" font-size=\"13\" fill=\"#34d399\">+ validar(): bool<\u002Ftext>\n\n        <!-- CoeficienteAproveitamento -->\n        <rect x=\"0\" y=\"360\" width=\"300\" height=\"145\" rx=\"9\" fill=\"#0f1829\" stroke=\"#fb923c\" stroke-width=\"2\"><\u002Frect>\n        <rect x=\"0\" y=\"360\" width=\"300\" height=\"38\" rx=\"9\" fill=\"rgba(251,146,60,0.12)\"><\u002Frect>\n        <rect x=\"0\" y=\"386\" width=\"300\" height=\"12\" fill=\"#0f1829\"><\u002Frect>\n        <text x=\"150\" y=\"385\" text-anchor=\"middle\" font-family=\"Sora\" font-size=\"14\" font-weight=\"700\" fill=\"#fb923c\">CoeficienteAproveitamento<\u002Ftext>\n        <text x=\"150\" y=\"399\" text-anchor=\"middle\" font-family=\"Sora\" font-size=\"10\" fill=\"#64748b\">«dataclass»<\u002Ftext>\n        <line x1=\"0\" y1=\"407\" x2=\"300\" y2=\"407\" stroke=\"#1e2d47\"><\u002Fline>\n        <text x=\"12\" y=\"427\" font-family=\"JetBrains Mono\" font-size=\"13\" fill=\"#94a3b8\">+ valor: float = 0.0<\u002Ftext>\n        <line x1=\"0\" y1=\"437\" x2=\"300\" y2=\"437\" stroke=\"#1e2d47\"><\u002Fline>\n        <text x=\"12\" y=\"458\" font-family=\"JetBrains Mono\" font-size=\"13\" fill=\"#34d399\">+ calcular(membros): float<\u002Ftext>\n\n        <!-- ModeloRL -->\n        <rect x=\"780\" y=\"80\" width=\"300\" height=\"190\" rx=\"9\" fill=\"#0f1829\" stroke=\"#38bdf8\" stroke-width=\"2\"><\u002Frect>\n        <rect x=\"780\" y=\"80\" width=\"300\" height=\"38\" rx=\"9\" fill=\"rgba(56,189,248,0.12)\"><\u002Frect>\n        <rect x=\"780\" y=\"106\" width=\"300\" height=\"12\" fill=\"#0f1829\"><\u002Frect>\n        <text x=\"930\" y=\"106\" text-anchor=\"middle\" font-family=\"Sora\" font-size=\"15\" font-weight=\"700\" fill=\"#38bdf8\">ModeloRL<\u002Ftext>\n        <line x1=\"780\" y1=\"118\" x2=\"1080\" y2=\"118\" stroke=\"#1e2d47\"><\u002Fline>\n        <text x=\"792\" y=\"138\" font-family=\"JetBrains Mono\" font-size=\"13\" fill=\"#94a3b8\">- pesos: ndarray<\u002Ftext>\n        <text x=\"792\" y=\"156\" font-family=\"JetBrains Mono\" font-size=\"13\" fill=\"#94a3b8\">- epsilon: float<\u002Ftext>\n        <text x=\"792\" y=\"174\" font-family=\"JetBrains Mono\" font-size=\"13\" fill=\"#94a3b8\">- versao: int<\u002Ftext>\n        <line x1=\"780\" y1=\"184\" x2=\"1080\" y2=\"184\" stroke=\"#1e2d47\"><\u002Fline>\n        <text x=\"792\" y=\"206\" font-family=\"JetBrains Mono\" font-size=\"13\" fill=\"#34d399\">+ predizer(colab, crit): List<\u002Ftext>\n        <text x=\"792\" y=\"226\" font-family=\"JetBrains Mono\" font-size=\"13\" fill=\"#34d399\">+ treinar(feedback): void<\u002Ftext>\n\n        <!-- GeradorEquipes (central) -->\n        <rect x=\"380\" y=\"240\" width=\"340\" height=\"200\" rx=\"9\" fill=\"#0f1829\" stroke=\"#34d399\" stroke-width=\"2.5\"><\u002Frect>\n        <rect x=\"380\" y=\"240\" width=\"340\" height=\"38\" rx=\"9\" fill=\"rgba(52,211,153,0.14)\"><\u002Frect>\n        <rect x=\"380\" y=\"266\" width=\"340\" height=\"12\" fill=\"#0f1829\"><\u002Frect>\n        <text x=\"550\" y=\"266\" text-anchor=\"middle\" font-family=\"Sora\" font-size=\"16\" font-weight=\"700\" fill=\"#34d399\">GeradorEquipes<\u002Ftext>\n        <line x1=\"380\" y1=\"278\" x2=\"720\" y2=\"278\" stroke=\"#1e2d47\"><\u002Fline>\n        <text x=\"392\" y=\"300\" font-family=\"JetBrains Mono\" font-size=\"13\" fill=\"#94a3b8\">- modelo: ModeloRL<\u002Ftext>\n        <text x=\"392\" y=\"318\" font-family=\"JetBrains Mono\" font-size=\"13\" fill=\"#94a3b8\">- criterio: CriterioFormacao<\u002Ftext>\n        <text x=\"392\" y=\"336\" font-family=\"JetBrains Mono\" font-size=\"13\" fill=\"#94a3b8\">- historico: List[dict]<\u002Ftext>\n        <line x1=\"380\" y1=\"346\" x2=\"720\" y2=\"346\" stroke=\"#1e2d47\"><\u002Fline>\n        <text x=\"392\" y=\"368\" font-family=\"JetBrains Mono\" font-size=\"13\" fill=\"#34d399\">+ gerar(colab): Equipe<\u002Ftext>\n        <text x=\"392\" y=\"390\" font-family=\"JetBrains Mono\" font-size=\"13\" fill=\"#34d399\">+ aplicar_feedback(fb): void<\u002Ftext>\n\n        <!-- Equipe -->\n        <rect x=\"380\" y=\"520\" width=\"340\" height=\"140\" rx=\"9\" fill=\"#0f1829\" stroke=\"#fbbf24\" stroke-width=\"2\"><\u002Frect>\n        <rect x=\"380\" y=\"520\" width=\"340\" height=\"38\" rx=\"9\" fill=\"rgba(251,191,36,0.12)\"><\u002Frect>\n        <rect x=\"380\" y=\"546\" width=\"340\" height=\"12\" fill=\"#0f1829\"><\u002Frect>\n        <text x=\"550\" y=\"546\" text-anchor=\"middle\" font-family=\"Sora\" font-size=\"15\" font-weight=\"700\" fill=\"#fbbf24\">Equipe<\u002Ftext>\n        <line x1=\"380\" y1=\"558\" x2=\"720\" y2=\"558\" stroke=\"#1e2d47\"><\u002Fline>\n        <text x=\"392\" y=\"578\" font-family=\"JetBrains Mono\" font-size=\"13\" fill=\"#94a3b8\">+ id: UUID<\u002Ftext>\n        <text x=\"392\" y=\"596\" font-family=\"JetBrains Mono\" font-size=\"13\" fill=\"#94a3b8\">+ membros: List<\u002Ftext>\n        <text x=\"392\" y=\"614\" font-family=\"JetBrains Mono\" font-size=\"13\" fill=\"#94a3b8\">+ coeficiente: CoefAproveitamento<\u002Ftext>\n\n        <!-- Arrows -->\n        <line x1=\"300\" y1=\"175\" x2=\"378\" y2=\"320\" stroke=\"#a78bfa\" stroke-width=\"1.5\" marker-end=\"url(#cd)\"><\u002Fline>\n        <text x=\"290\" y=\"250\" font-family=\"Sora\" font-size=\"11\" fill=\"#a78bfa\">usa<\u002Ftext>\n\n        <line x1=\"300\" y1=\"435\" x2=\"378\" y2=\"420\" stroke=\"#fb923c\" stroke-width=\"1.5\" marker-end=\"url(#cd)\"><\u002Fline>\n        <text x=\"310\" y=\"430\" font-family=\"Sora\" font-size=\"11\" fill=\"#fb923c\">gera<\u002Ftext>\n\n        <line x1=\"780\" y1=\"175\" x2=\"722\" y2=\"300\" stroke=\"#38bdf8\" stroke-width=\"1.5\" marker-end=\"url(#cd)\"><\u002Fline>\n        <text x=\"775\" y=\"250\" font-family=\"Sora\" font-size=\"11\" fill=\"#38bdf8\">possui<\u002Ftext>\n\n        <line x1=\"550\" y1=\"440\" x2=\"550\" y2=\"518\" stroke=\"#fbbf24\" stroke-width=\"1.5\" marker-end=\"url(#cd)\"><\u002Fline>\n        <text x=\"558\" y=\"485\" font-family=\"Sora\" font-size=\"11\" fill=\"#fbbf24\">retorna<\u002Ftext>\n      <\u002Fsvg>\n      <div style=\"flex:1;display:flex;flex-direction:column;gap:20px;padding-top:32px;\">\n        <div class=\"card\" style=\"border-color:rgba(52,211,153,0.3);background:rgba(52,211,153,0.05);\">\n          <div style=\"font-size:14px;font-weight:600;color:var(--green);margin-bottom:8px;\">Correspondência código ↔ diagrama<\u002Fdiv>\n          <div style=\"display:flex;flex-direction:column;gap:8px;font-size:14px;color:var(--muted2);\">\n            <span>• <code style=\"color:var(--cyan);\">@dataclass<\u002Fcode> → classes com campos tipados<\u002Fspan>\n            <span>• <code style=\"color:var(--green);\">def gerar()<\u002Fcode> → método central com retorno <code style=\"color:var(--yellow);\">Equipe<\u002Fcode><\u002Fspan>\n            <span>• Composição: <code style=\"color:var(--purple);\">CriterioFormacao<\u002Fcode> injetado no construtor<\u002Fspan>\n            <span>• <code style=\"color:var(--cyan);\">ModeloRL<\u002Fcode> instanciado internamente (acoplamento)<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"card card-accent-yellow\" style=\"--yellow:#fbbf24;\">\n          <div style=\"font-size:14px;font-weight:600;color:var(--yellow);margin-bottom:8px;\">Observação para o próximo passo<\u002Fdiv>\n          <div style=\"font-size:14px;color:var(--muted2);line-height:1.6;\">\n            Note que <strong style=\"color:var(--text);\">GeradorEquipes instancia ModeloRL diretamente<\u002Fstrong> — isso viola o princípio de Inversão de Dependência do SOLID. Veremos como corrigir isso!\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <div class=\"bottom-bar\"><\u002Fdiv>\n<\u002Fsection>\n\n<!-- ═══════════════════════════════════════════════════\n     SLIDE 10 — O QUE É SOLID\n════════════════════════════════════════════════════ -->\n<section data-screen-label=\"10 O que é SOLID\">\n  <div class=\"glow-cyan\" style=\"width:600px;height:600px;top:-200px;left:400px;\"><\u002Fdiv>\n  <div class=\"glow-purple\" style=\"width:500px;height:500px;bottom:-150px;right:200px;\"><\u002Fdiv>\n  <div class=\"slide-inner pad\">\n    <div class=\"eyebrow\">Princípios de Design Orientado a Objetos<\u002Fdiv>\n    <h2 style=\"margin-bottom:8px;\">O que é <span style=\"color:var(--cyan);\">SOLID<\u002Fspan>?<\u002Fh2>\n    <div class=\"divider\" style=\"margin-bottom:32px;\"><\u002Fdiv>\n    <div style=\"display:flex;gap:20px;flex:1;\">\n      <div class=\"solid-card\">\n        <div class=\"solid-letter\">S<\u002Fdiv>\n        <div class=\"solid-name\">Single Responsibility<\u002Fdiv>\n        <div class=\"solid-desc\">Uma classe deve ter <strong>apenas uma razão para mudar<\u002Fstrong>. Cada classe é responsável por uma única parte da funcionalidade.<\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"solid-card\">\n        <div class=\"solid-letter\">O<\u002Fdiv>\n        <div class=\"solid-name\">Open / Closed<\u002Fdiv>\n        <div class=\"solid-desc\">Aberta para extensão, fechada para modificação. Adicione novos comportamentos sem alterar código já existente.<\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"solid-card\">\n        <div class=\"solid-letter\">L<\u002Fdiv>\n        <div class=\"solid-name\">Liskov Substitution<\u002Fdiv>\n        <div class=\"solid-desc\">Subclasses devem poder <strong>substituir suas superclasses<\u002Fstrong> sem alterar o comportamento esperado do programa.<\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"solid-card\">\n        <div class=\"solid-letter\">I<\u002Fdiv>\n        <div class=\"solid-name\">Interface Segregation<\u002Fdiv>\n        <div class=\"solid-desc\">Interfaces devem ser <strong>pequenas e específicas<\u002Fstrong>. Clientes não devem depender de métodos que não utilizam.<\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"solid-card\">\n        <div class=\"solid-letter\">D<\u002Fdiv>\n        <div class=\"solid-name\">Dependency Inversion<\u002Fdiv>\n        <div class=\"solid-desc\">Módulos de alto nível não devem depender de módulos de baixo nível. Ambos devem depender de <strong>abstrações (interfaces)<\u002Fstrong>.<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"margin-top:24px;text-align:center;font-size:17px;color:var(--muted2);\">\n      Princípios definidos por <strong style=\"color:var(--text);\">Robert C. Martin (Uncle Bob)<\u002Fstrong> — fundamentos para código <span style=\"color:var(--cyan);\">manutenível, extensível e testável<\u002Fspan>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <div class=\"bottom-bar\"><\u002Fdiv>\n<\u002Fsection>\n\n<!-- ═══════════════════════════════════════════════════\n     SLIDE 11 — SOLID NO RANK-IA\n════════════════════════════════════════════════════ -->\n<section data-screen-label=\"11 SOLID no RANK-IA\">\n  <div class=\"glow-purple\" style=\"width:500px;height:400px;top:0;right:100px;\"><\u002Fdiv>\n  <div class=\"slide-inner pad-sm\">\n    <div class=\"eyebrow\">Aplicação prática<\u002Fdiv>\n    <h2 style=\"margin-bottom:8px;\">Importância do SOLID <span style=\"color:var(--purple);\">no RANK-IA<\u002Fspan><\u002Fh2>\n    <div class=\"divider\" style=\"margin-bottom:28px;\"><\u002Fdiv>\n    <div style=\"display:flex;gap:32px;height:780px;\">\n      <div style=\"flex:1;display:flex;flex-direction:column;gap:16px;\">\n        <div class=\"card\" style=\"border-left:4px solid var(--cyan);border-radius:12px;\">\n          <div style=\"display:flex;align-items:center;gap:14px;margin-bottom:8px;\">\n            <div style=\"font-size:24px;font-weight:800;color:var(--cyan);\">S<\u002Fdiv>\n            <div style=\"font-size:15px;font-weight:600;\">Single Responsibility<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"font-size:14px;color:var(--muted2);line-height:1.6;\"><strong style=\"color:var(--text);\">GeradorEquipes<\u002Fstrong> só gera equipes. <strong style=\"color:var(--text);\">ServicoRelatorio<\u002Fstrong> só gera relatórios. <strong style=\"color:var(--text);\">ServicoNotificacao<\u002Fstrong> só notifica. Cada serviço evolui independentemente.<\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"card\" style=\"border-left:4px solid var(--purple);border-radius:12px;\">\n          <div style=\"display:flex;align-items:center;gap:14px;margin-bottom:8px;\">\n            <div style=\"font-size:24px;font-weight:800;color:var(--purple);\">O<\u002Fdiv>\n            <div style=\"font-size:15px;font-weight:600;\">Open / Closed<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"font-size:14px;color:var(--muted2);line-height:1.6;\">Novos algoritmos de avaliação podem ser adicionados implementando <strong style=\"color:var(--text);\">IAvaliadorEquipe<\u002Fstrong> sem modificar o core do GeradorEquipes.<\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"card\" style=\"border-left:4px solid var(--green);border-radius:12px;\">\n          <div style=\"display:flex;align-items:center;gap:14px;margin-bottom:8px;\">\n            <div style=\"font-size:24px;font-weight:800;color:var(--green);\">L<\u002Fdiv>\n            <div style=\"font-size:15px;font-weight:600;\">Liskov Substitution<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"font-size:14px;color:var(--muted2);line-height:1.6;\"><strong style=\"color:var(--text);\">AvaliadorIA<\u002Fstrong> e <strong style=\"color:var(--text);\">AvaliadorRegras<\u002Fstrong> são intercambiáveis — o sistema funciona corretamente com qualquer implementação de IAvaliadorEquipe.<\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"card\" style=\"border-left:4px solid var(--yellow);border-radius:12px;\">\n          <div style=\"display:flex;align-items:center;gap:14px;margin-bottom:8px;\">\n            <div style=\"font-size:24px;font-weight:800;color:var(--yellow);\">I<\u002Fdiv>\n            <div style=\"font-size:15px;font-weight:600;\">Interface Segregation<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"font-size:14px;color:var(--muted2);line-height:1.6;\">Interfaces separadas: <code style=\"color:var(--cyan);\">IRepositorioEquipe<\u002Fcode>, <code style=\"color:var(--purple);\">IAvaliadorEquipe<\u002Fcode>, <code style=\"color:var(--green);\">INotificador<\u002Fcode>. Cada componente depende só do que usa.<\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"card\" style=\"border-left:4px solid #fb923c;border-radius:12px;\">\n          <div style=\"display:flex;align-items:center;gap:14px;margin-bottom:8px;\">\n            <div style=\"font-size:24px;font-weight:800;color:#fb923c;\">D<\u002Fdiv>\n            <div style=\"font-size:15px;font-weight:600;\">Dependency Inversion<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"font-size:14px;color:var(--muted2);line-height:1.6;\"><strong style=\"color:var(--text);\">GeradorEquipes<\u002Fstrong> recebe <strong style=\"color:var(--text);\">IAvaliadorEquipe<\u002Fstrong> via injeção — não conhece a implementação concreta. Fácil de testar com mocks.<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <!-- Benefits column -->\n      <div style=\"flex:0.8;display:flex;flex-direction:column;gap:16px;\">\n        <div style=\"font-size:13px;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);margin-bottom:4px;\">Benefícios no contexto do RANK-IA<\u002Fdiv>\n        <div style=\"background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:20px 24px;display:flex;flex-direction:column;gap:14px;\">\n          <div style=\"display:flex;gap:12px;align-items:flex-start;\">\n            <div style=\"width:6px;height:6px;border-radius:50%;background:var(--cyan);margin-top:7px;flex-shrink:0;\"><\u002Fdiv>\n            <span style=\"font-size:15px;color:var(--muted2);line-height:1.5;\">Trocar o modelo de RL por outro algoritmo sem quebrar o sistema<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"display:flex;gap:12px;align-items:flex-start;\">\n            <div style=\"width:6px;height:6px;border-radius:50%;background:var(--purple);margin-top:7px;flex-shrink:0;\"><\u002Fdiv>\n            <span style=\"font-size:15px;color:var(--muted2);line-height:1.5;\">Testar cada serviço isoladamente com mocks e stubs<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"display:flex;gap:12px;align-items:flex-start;\">\n            <div style=\"width:6px;height:6px;border-radius:50%;background:var(--green);margin-top:7px;flex-shrink:0;\"><\u002Fdiv>\n            <span style=\"font-size:15px;color:var(--muted2);line-height:1.5;\">Equipe pode trabalhar em paralelo em serviços distintos sem conflitos<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"display:flex;gap:12px;align-items:flex-start;\">\n            <div style=\"width:6px;height:6px;border-radius:50%;background:var(--yellow);margin-top:7px;flex-shrink:0;\"><\u002Fdiv>\n            <span style=\"font-size:15px;color:var(--muted2);line-height:1.5;\">Adicionar novos critérios de formação sem risco de regressão<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"display:flex;gap:12px;align-items:flex-start;\">\n            <div style=\"width:6px;height:6px;border-radius:50%;background:#fb923c;margin-top:7px;flex-shrink:0;\"><\u002Fdiv>\n            <span style=\"font-size:15px;color:var(--muted2);line-height:1.5;\">Conformidade com boas práticas → código auditável (LGPD)<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"background:rgba(56,189,248,0.05);border:1px solid rgba(56,189,248,0.2);border-radius:12px;padding:20px 24px;\">\n          <div style=\"font-size:14px;font-weight:600;color:var(--cyan);margin-bottom:10px;\">Resumo da transformação<\u002Fdiv>\n          <div style=\"display:flex;align-items:center;gap:12px;font-size:14px;\">\n            <div style=\"background:rgba(239,68,68,0.1);border:1px solid rgba(239,68,68,0.3);border-radius:8px;padding:8px 14px;color:#f87171;font-weight:600;\">God Class<\u002Fdiv>\n            <div style=\"color:var(--muted);\">→<\u002Fdiv>\n            <div style=\"background:rgba(52,211,153,0.1);border:1px solid rgba(52,211,153,0.3);border-radius:8px;padding:8px 14px;color:var(--green);font-weight:600;\">Serviços SOLID<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <div class=\"bottom-bar\"><\u002Fdiv>\n<\u002Fsection>\n\n<!-- ═══════════════════════════════════════════════════\n     SLIDE 12 — CÓDIGO ANTIGO (antes do SOLID)\n════════════════════════════════════════════════════ -->\n<section data-screen-label=\"12 Código Antigo\">\n  <div class=\"slide-inner pad-sm\">\n    <div class=\"eyebrow\" style=\"color:#f87171;\">Problema identificado — violações de SOLID<\u002Fdiv>\n    <h2 style=\"margin-bottom:8px;\">Código <span style=\"color:#f87171;\">Antes<\u002Fspan> do SOLID<\u002Fh2>\n    <div class=\"divider\" style=\"background:linear-gradient(90deg,#f87171,#fb923c);margin-bottom:24px;\"><\u002Fdiv>\n    <div style=\"display:flex;gap:32px;\">\n      <pre style=\"flex:1;font-size:13px;line-height:1.6;overflow:hidden;\"><span class=\"cm\"># ❌ God Class — viola S, O e D<\u002Fspan>\n<span class=\"kw\">class<\u002Fspan> <span class=\"cls\">GerenciadorDeEquipes<\u002Fspan>:\n    <span class=\"kw\">def<\u002Fspan> <span class=\"fn\">__init__<\u002Fspan>(<span class=\"kw\">self<\u002Fspan>, db_conn):\n        <span class=\"kw\">self<\u002Fspan>.db = db_conn\n        <span class=\"cm\"># ❌ instancia diretamente — viola D<\u002Fspan>\n        <span class=\"kw\">self<\u002Fspan>.modelo_ia = <span class=\"cls\">ModeloRL<\u002Fspan>()\n        <span class=\"kw\">self<\u002Fspan>.smtp = <span class=\"cls\">SMTPClient<\u002Fspan>(<span class=\"st\">\"smtp.corp.com\"<\u002Fspan>)\n\n    <span class=\"cm\"># ❌ gera equipe E persiste E notifica (viola S)<\u002Fspan>\n    <span class=\"kw\">def<\u002Fspan> <span class=\"fn\">gerar_equipe<\u002Fspan>(<span class=\"kw\">self<\u002Fspan>, colaboradores, criterios):\n        membros = <span class=\"kw\">self<\u002Fspan>.modelo_ia.predizer(colaboradores)\n        equipe = <span class=\"cls\">Equipe<\u002Fspan>(membros)\n        <span class=\"cm\"># ❌ BD dentro do gerador<\u002Fspan>\n        <span class=\"kw\">self<\u002Fspan>.db.execute(<span class=\"st\">\"INSERT INTO equipes...\"<\u002Fspan>, equipe)\n        <span class=\"cm\"># ❌ e-mail dentro do gerador<\u002Fspan>\n        <span class=\"kw\">self<\u002Fspan>.smtp.send(destinatarios, equipe)\n        <span class=\"kw\">return<\u002Fspan> equipe\n\n    <span class=\"cm\"># ❌ relatório misturado no mesmo lugar<\u002Fspan>\n    <span class=\"kw\">def<\u002Fspan> <span class=\"fn\">gerar_relatorio<\u002Fspan>(<span class=\"kw\">self<\u002Fspan>, equipe):\n        dados = <span class=\"kw\">self<\u002Fspan>.db.query(<span class=\"st\">\"SELECT * FROM ...\"<\u002Fspan>)\n        <span class=\"kw\">return<\u002Fspan> <span class=\"cls\">PDFExporter<\u002Fspan>().exportar(dados)\n\n    <span class=\"cm\"># ❌ treinamento da IA aqui também<\u002Fspan>\n    <span class=\"kw\">def<\u002Fspan> <span class=\"fn\">treinar_modelo<\u002Fspan>(<span class=\"kw\">self<\u002Fspan>, feedback):\n        <span class=\"kw\">self<\u002Fspan>.modelo_ia.atualizar(feedback)\n\n    <span class=\"cm\"># ❌ sugestão de treinamentos no gerador?!<\u002Fspan>\n    <span class=\"kw\">def<\u002Fspan> <span class=\"fn\">sugerir_treinamentos<\u002Fspan>(<span class=\"kw\">self<\u002Fspan>, colaborador):\n        <span class=\"kw\">return<\u002Fspan> <span class=\"kw\">self<\u002Fspan>.db.query(\n            <span class=\"st\">\"SELECT * FROM treinamentos\"<\u002Fspan>\n            <span class=\"st\">\" WHERE area IN ?\"<\u002Fspan>, colaborador.gaps\n        )<\u002Fpre>\n      <div style=\"flex:0.7;display:flex;flex-direction:column;gap:16px;\">\n        <div style=\"font-size:15px;font-weight:600;color:#f87171;margin-bottom:4px;\">Problemas encontrados<\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:12px;\">\n          <div style=\"background:rgba(239,68,68,0.08);border:1px solid rgba(239,68,68,0.25);border-radius:10px;padding:16px;\">\n            <div style=\"font-size:13px;font-weight:700;color:#f87171;margin-bottom:6px;\">❌ S — Múltiplas responsabilidades<\u002Fdiv>\n            <div style=\"font-size:13px;color:var(--muted2);line-height:1.5;\">Uma única classe gera equipes, persiste no BD, envia e-mail, gera relatórios e sugere treinamentos.<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"background:rgba(239,68,68,0.08);border:1px solid rgba(239,68,68,0.25);border-radius:10px;padding:16px;\">\n            <div style=\"font-size:13px;font-weight:700;color:#f87171;margin-bottom:6px;\">❌ O — Difícil de estender<\u002Fdiv>\n            <div style=\"font-size:13px;color:var(--muted2);line-height:1.5;\">Para trocar o algoritmo de IA, é necessário modificar diretamente a classe, arriscando quebrar outras funções.<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"background:rgba(239,68,68,0.08);border:1px solid rgba(239,68,68,0.25);border-radius:10px;padding:16px;\">\n            <div style=\"font-size:13px;font-weight:700;color:#f87171;margin-bottom:6px;\">❌ D — Dependência concreta<\u002Fdiv>\n            <div style=\"font-size:13px;color:var(--muted2);line-height:1.5;\"><code style=\"color:#f87171;\">ModeloRL()<\u002Fcode> e <code style=\"color:#f87171;\">SMTPClient()<\u002Fcode> instanciados internamente — impossível de mockar nos testes.<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"background:rgba(239,68,68,0.08);border:1px solid rgba(239,68,68,0.25);border-radius:10px;padding:16px;\">\n            <div style=\"font-size:13px;font-weight:700;color:#f87171;margin-bottom:6px;\">❌ Consequências práticas<\u002Fdiv>\n            <div style=\"font-size:13px;color:var(--muted2);line-height:1.5;\">Impossível testar isoladamente. Qualquer mudança pode quebrar partes não relacionadas. Código frágil.<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <div class=\"bottom-bar\" style=\"background:linear-gradient(90deg,#f87171,#fb923c,#f87171);\"><\u002Fdiv>\n<\u002Fsection>\n\n<!-- ═══════════════════════════════════════════════════\n     SLIDE 13 — CÓDIGO COM SOLID\n════════════════════════════════════════════════════ -->\n<section data-screen-label=\"13 Código com SOLID\">\n  <div class=\"glow-green\" style=\"position:absolute;width:500px;height:500px;top:-100px;left:500px;border-radius:50%;filter:blur(140px);background:rgba(52,211,153,0.09);\"><\u002Fdiv>\n  <div class=\"slide-inner pad-sm\">\n    <div class=\"eyebrow\" style=\"color:var(--green);\">Refatoração — princípios aplicados<\u002Fdiv>\n    <h2 style=\"margin-bottom:8px;\">Código <span style=\"color:var(--green);\">Depois<\u002Fspan> do SOLID<\u002Fh2>\n    <div class=\"divider\" style=\"background:linear-gradient(90deg,var(--green),var(--cyan));margin-bottom:20px;\"><\u002Fdiv>\n    <div style=\"display:flex;gap:24px;\">\n      <pre style=\"flex:1;font-size:15px;line-height:1.7;\"><span class=\"kw\">from<\u002Fspan> abc <span class=\"kw\">import<\u002Fspan> ABC, abstractmethod\n\n<span class=\"cm\"># ✅ D — Abstrações (interfaces)<\u002Fspan>\n<span class=\"kw\">class<\u002Fspan> <span class=\"cls\">IAvaliadorEquipe<\u002Fspan>(ABC):\n    <span class=\"dt\">@abstractmethod<\u002Fspan>\n    <span class=\"kw\">def<\u002Fspan> <span class=\"fn\">avaliar<\u002Fspan>(<span class=\"kw\">self<\u002Fspan>, colaboradores, criterio): ...\n\n<span class=\"kw\">class<\u002Fspan> <span class=\"cls\">IRepositorioEquipe<\u002Fspan>(ABC):\n    <span class=\"dt\">@abstractmethod<\u002Fspan>\n    <span class=\"kw\">def<\u002Fspan> <span class=\"fn\">salvar<\u002Fspan>(<span class=\"kw\">self<\u002Fspan>, equipe: <span class=\"cls\">Equipe<\u002Fspan>): ...\n\n<span class=\"kw\">class<\u002Fspan> <span class=\"cls\">INotificador<\u002Fspan>(ABC):\n    <span class=\"dt\">@abstractmethod<\u002Fspan>\n    <span class=\"kw\">def<\u002Fspan> <span class=\"fn\">notificar<\u002Fspan>(<span class=\"kw\">self<\u002Fspan>, equipe, dest): ...\n\n<span class=\"cm\"># ✅ O + L — Implementações intercambiáveis<\u002Fspan>\n<span class=\"kw\">class<\u002Fspan> <span class=\"cls\">AvaliadorIA<\u002Fspan>(<span class=\"cls\">IAvaliadorEquipe<\u002Fspan>):\n    <span class=\"kw\">def<\u002Fspan> <span class=\"fn\">__init__<\u002Fspan>(<span class=\"kw\">self<\u002Fspan>, modelo: <span class=\"cls\">ModeloRL<\u002Fspan>):\n        <span class=\"kw\">self<\u002Fspan>.modelo = modelo\n    <span class=\"kw\">def<\u002Fspan> <span class=\"fn\">avaliar<\u002Fspan>(<span class=\"kw\">self<\u002Fspan>, colaboradores, criterio):\n        membros = <span class=\"kw\">self<\u002Fspan>.modelo.predizer(colaboradores, criterio)\n        <span class=\"kw\">return<\u002Fspan> <span class=\"cls\">Equipe<\u002Fspan>(membros=membros)\n\n<span class=\"kw\">class<\u002Fspan> <span class=\"cls\">AvaliadorRegras<\u002Fspan>(<span class=\"cls\">IAvaliadorEquipe<\u002Fspan>):\n    <span class=\"cm\"># ✅ Fallback sem IA — mesmo contrato<\u002Fspan>\n    <span class=\"kw\">def<\u002Fspan> <span class=\"fn\">avaliar<\u002Fspan>(<span class=\"kw\">self<\u002Fspan>, colaboradores, criterio):\n        top = <span class=\"kw\">sorted<\u002Fspan>(colaboradores,\n            key=<span class=\"kw\">lambda<\u002Fspan> c: <span class=\"kw\">len<\u002Fspan>(c.habilidades))\n        <span class=\"kw\">return<\u002Fspan> <span class=\"cls\">Equipe<\u002Fspan>(membros=top[:criterio.tamanho])<\u002Fpre>\n      <pre style=\"flex:1;font-size:13px;line-height:1.6;overflow:hidden;\"><span class=\"cm\"># ✅ S — Cada classe tem 1 responsabilidade<\u002Fspan>\n<span class=\"kw\">class<\u002Fspan> <span class=\"cls\">GeradorEquipes<\u002Fspan>:\n    <span class=\"cm\"># ✅ D — depende de abstrações (injeção)<\u002Fspan>\n    <span class=\"kw\">def<\u002Fspan> <span class=\"fn\">__init__<\u002Fspan>(<span class=\"kw\">self<\u002Fspan>,\n        avaliador: <span class=\"cls\">IAvaliadorEquipe<\u002Fspan>,\n        repositorio: <span class=\"cls\">IRepositorioEquipe<\u002Fspan>\n    ):\n        <span class=\"kw\">self<\u002Fspan>.avaliador = avaliador\n        <span class=\"kw\">self<\u002Fspan>.repositorio = repositorio\n\n    <span class=\"kw\">def<\u002Fspan> <span class=\"fn\">gerar<\u002Fspan>(<span class=\"kw\">self<\u002Fspan>, colaboradores, criterio):\n        equipe = <span class=\"kw\">self<\u002Fspan>.avaliador.avaliar(colaboradores, criterio)\n        <span class=\"kw\">self<\u002Fspan>.repositorio.salvar(equipe)\n        <span class=\"kw\">return<\u002Fspan> equipe\n\n<span class=\"cm\"># ✅ S — Relatório separado<\u002Fspan>\n<span class=\"kw\">class<\u002Fspan> <span class=\"cls\">ServicoRelatorio<\u002Fspan>:\n    <span class=\"kw\">def<\u002Fspan> <span class=\"fn\">__init__<\u002Fspan>(<span class=\"kw\">self<\u002Fspan>, repo: <span class=\"cls\">IRepositorioEquipe<\u002Fspan>):\n        <span class=\"kw\">self<\u002Fspan>.repo = repo\n    <span class=\"kw\">def<\u002Fspan> <span class=\"fn\">gerar<\u002Fspan>(<span class=\"kw\">self<\u002Fspan>, equipe) -&gt; <span class=\"cls\">Relatorio<\u002Fspan>:\n        <span class=\"kw\">return<\u002Fspan> <span class=\"cls\">Relatorio<\u002Fspan>(dados=equipe.membros)\n\n<span class=\"cm\"># ✅ S — Notificação separada<\u002Fspan>\n<span class=\"kw\">class<\u002Fspan> <span class=\"cls\">ServicoNotificacao<\u002Fspan>:\n    <span class=\"kw\">def<\u002Fspan> <span class=\"fn\">__init__<\u002Fspan>(<span class=\"kw\">self<\u002Fspan>, notif: <span class=\"cls\">INotificador<\u002Fspan>):\n        <span class=\"kw\">self<\u002Fspan>.notif = notif\n    <span class=\"kw\">def<\u002Fspan> <span class=\"fn\">avisar<\u002Fspan>(<span class=\"kw\">self<\u002Fspan>, equipe, dest):\n        <span class=\"kw\">self<\u002Fspan>.notif.notificar(equipe, dest)\n\n<span class=\"cm\"># ✅ Composição na aplicação<\u002Fspan>\ngerador = <span class=\"cls\">GeradorEquipes<\u002Fspan>(\n    avaliador=<span class=\"cls\">AvaliadorIA<\u002Fspan>(<span class=\"cls\">ModeloRL<\u002Fspan>()),\n    repositorio=<span class=\"cls\">PostgresRepo<\u002Fspan>(db_conn)\n)<\u002Fpre>\n      <div style=\"flex:0.55;display:flex;flex-direction:column;gap:12px;\">\n        <div style=\"font-size:14px;font-weight:600;color:var(--green);margin-bottom:4px;\">Melhorias aplicadas<\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:10px;\">\n          <div style=\"background:rgba(52,211,153,0.07);border:1px solid rgba(52,211,153,0.25);border-radius:10px;padding:14px;\">\n            <div style=\"font-size:12px;font-weight:700;color:var(--green);margin-bottom:4px;\">✅ S — 1 classe, 1 responsabilidade<\u002Fdiv>\n            <div style=\"font-size:12px;color:var(--muted2);\">Gerador, Relatório e Notificação são classes independentes<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"background:rgba(52,211,153,0.07);border:1px solid rgba(52,211,153,0.25);border-radius:10px;padding:14px;\">\n            <div style=\"font-size:12px;font-weight:700;color:var(--green);margin-bottom:4px;\">✅ O — Extensível sem modificar<\u002Fdiv>\n            <div style=\"font-size:12px;color:var(--muted2);\">Novo avaliador: basta implementar IAvaliadorEquipe<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"background:rgba(52,211,153,0.07);border:1px solid rgba(52,211,153,0.25);border-radius:10px;padding:14px;\">\n            <div style=\"font-size:12px;font-weight:700;color:var(--green);margin-bottom:4px;\">✅ L — Avaliadores intercambiáveis<\u002Fdiv>\n            <div style=\"font-size:12px;color:var(--muted2);\">AvaliadorIA e AvaliadorRegras são substituíveis<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"background:rgba(52,211,153,0.07);border:1px solid rgba(52,211,153,0.25);border-radius:10px;padding:14px;\">\n            <div style=\"font-size:12px;font-weight:700;color:var(--green);margin-bottom:4px;\">✅ I — Interfaces mínimas<\u002Fdiv>\n            <div style=\"font-size:12px;color:var(--muted2);\">IAvaliador, IRepositorio e INotificador separados<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"background:rgba(52,211,153,0.07);border:1px solid rgba(52,211,153,0.25);border-radius:10px;padding:14px;\">\n            <div style=\"font-size:12px;font-weight:700;color:var(--green);margin-bottom:4px;\">✅ D — Injeção de dependência<\u002Fdiv>\n            <div style=\"font-size:12px;color:var(--muted2);\">GeradorEquipes recebe abstrações — 100% testável com mocks<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <div class=\"bottom-bar\" style=\"background:linear-gradient(90deg,var(--green),var(--cyan),var(--green));\"><\u002Fdiv>\n<\u002Fsection>\n\n<\u002Fdeck-stage>\n\n<script type=\"application/json\" id=\"speaker-notes\">\n[\n  \"Bom dia/tarde a todos. Hoje vamos apresentar o RANK-IA — um sistema corporativo de formação inteligente de equipes utilizando Reinforcement Learning, desenvolvido na disciplina de Engenharia de Software.\",\n  \"O RANK-IA nasce de uma dor real das empresas: montar equipes de forma eficiente é difícil e demorado. Nossa solução usa IA para automatizar esse processo, mantendo o controle humano por meio de ajustes manuais.\",\n  \"A arquitetura segue um modelo em camadas: SPA em React, API em FastAPI, Engine de RL em Python e banco PostgreSQL. Cada camada tem responsabilidade bem definida — o que nos conecta diretamente ao SOLID que veremos adiante.\",\n  \"No nível 1 do C4, vemos os atores externos e os sistemas com os quais o RANK-IA se comunica. Gestores têm acesso total, colaboradores têm acesso limitado, e o sistema depende de infraestrutura de rede.\",\n  \"Detalhando os containers internos, vemos como cada componente se comunica. Destaque para o ML Service, que roda o algoritmo de RL e é chamado pela API quando uma nova equipe precisa ser formada.\",\n  \"Este é o diagrama de classes geral que desenvolvemos no primeiro semestre. As principais classes são Usuario, Colaborador, Gestor, Equipe, GeradorEquipes e Relatorio. Vamos agora mergulhar mais fundo em GeradorEquipes.\",\n  \"Detalhamos o GeradorEquipes e suas classes colaboradoras: ModeloRL encapsula o algoritmo; CriterioFormacao define os parâmetros; HistoricoAjustes registra o feedback humano; e CoeficienteAproveitamento mede a qualidade da equipe.\",\n  \"Aqui está a implementação Python das principais classes. Note que GeradorEquipes instancia ModeloRL diretamente — esse é exatamente o problema que iremos resolver com SOLID.\",\n  \"O diagrama de classes gerado a partir do código confirma o que vimos: GeradorEquipes tem dependência direta de ModeloRL, o que viola o princípio D do SOLID. Vamos explorar isso nos próximos slides.\",\n  \"SOLID é um acrônimo de 5 princípios de design orientado a objetos definidos por Uncle Bob. Quando aplicados juntos, resultam em código mais manutenível, testável e extensível.\",\n  \"No contexto do RANK-IA, cada princípio tem uma aplicação concreta: S separa Gerador, Relatório e Notificação; O permite novos avaliadores sem modificar o core; L garante que AvaliadorIA e AvaliadorRegras sejam intercambiáveis; I segrega as interfaces; e D elimina o acoplamento com ModeloRL.\",\n  \"Este é o código antes do SOLID — uma God Class que concentra tudo: geração de equipes, persistência, notificação, relatórios e treinamento do modelo. Qualquer mudança nessa classe pode quebrar funcionalidades não relacionadas.\",\n  \"E este é o resultado após a refatoração. Cada classe tem uma responsabilidade única, as dependências são injetadas via interfaces, e é possível trocar qualquer implementação sem afetar o resto do sistema. O código agora é testável, extensível e manutenível.\"\n]\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
